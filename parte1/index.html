<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>CineTrack</h1>
      <input type="search" aria-label="Buscar Filme" />
      <button type="submit">
        <a href="adicionar.html">
          <span class="txtcurto">+</span>
          <span class="txtlongo">+ Adicionar</span>
        </a>
      </button>

      <div id="modal" hidden>
        <div class="modal-conteudo">
          <h2>Adicionar Filme</h2>
          <form id="form-filme">
              <p>
              <label for="titulo">Título</label><br>
              <input id="titulo" name="titulo" type="text" required>
              </p>
              
              <p>
                  <label for="ano">Ano</label><br>
                  <input id="ano" name="ano" type="number"
                          min="1888" max="2030" required>
              </p>
              
              <p>
                  <label for="genero">Gênero</label><br>
                  <input id="genero" name="genero" type="text" required>
              </p>
              
              <p>
                  <label for="URLposter">URL do pôster</label><br>
                  <input id="URLposter" name="URLposter" type="url">
              </p>
              
              <p>
                  <label for="status">Status</label><br>
                  <select name="status" id="status" required>
                      <option value="todos">Todos</option>
                      <option value="assistido">Assistido</option>
                      <option value="assistindo">Assistindo</option>
                      <option value="queroAssistir">Quero Assistir</option>
                  </select>
              </p>
              
              <p>
                  <label for="nota">Nota (1 a 5)</label><br>
                  <input id="nota" name="nota" type="number"
                          min="1" max="5">
              </p>
              
              <p>
                  <label for="comentario">Comentário</label><br>
                  <textarea id="comentario" name="comentario"></textarea>
              </p>
              
              <p>
                  <button type="button">Cancelar</button>
                  <button type="submit">Salvar</button>
              </p>
          </form>
        </div>
      </div>

    </header>

    <nav aria-label="Filtros de Status">
      <button class="ativo" data-status="todos">Todos</button>
      <button  data-status="assistido">Assistido</button>
      <button  data-status="assistindo">Assistindo</button>
      <button  data-status="quero">Quero assistir</button>
    </nav>

    <main>
      <h2 class="sr-only">Lista de Filmes</h2>
      <section id="lista" aria-live="polite">
      </section>
    </main>
    <footer>
      <small>CineTrack - UEM</small>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
